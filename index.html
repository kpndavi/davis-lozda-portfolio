<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Rivera | Neural Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-base: #050505;
            --text-primary: #f0f0f0;
            --text-muted: #888888;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-serif: 'Instrument Serif', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -2;
            opacity: 0.6;
            animation: pulseGlow 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow-1 {
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(90,40,255,0.2) 0%, rgba(0,0,0,0) 70%);
            top: -10%; left: -10%;
        }

        .glow-2 {
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(0,200,255,0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%; right: -10%;
            animation-delay: -5s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.7; }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* --- Top Navigation --- */
        .top-nav {
            position: fixed;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .nav-btn i { width: 16px; height: 16px; }
        .nav-btn:hover {
            background: rgba(40, 40, 40, 0.8);
            transform: translateY(-2px);
        }
        .nav-btn.primary {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255,255,255,0.3);
            font-weight: 500;
        }
        .nav-btn.primary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        
        @media (max-width: 600px) {
            .top-nav {
                top: 20px;
                right: 20px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }

        #graph-container { position: relative; width: 100%; height: 100%; transition: filter 0.3s ease; }
        .graph-blurred { filter: blur(8px) brightness(0.6); pointer-events: none; }

        #links-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .graph-link { stroke: rgba(255, 255, 255, 0.1); stroke-width: 2px; }
        #nodes-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        .graph-node { position: absolute; transform: translate(-50%, -50%); cursor: grab; }
        .graph-node:active { cursor: grabbing; }

        .root-node { display: flex; flex-direction: column; align-items: center; pointer-events: all; }
        .avatar-ring {
            width: 120px; height: 120px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
            padding: 2px; margin-bottom: 20px; box-shadow: 0 0 40px rgba(90,40,255,0.3);
        }
        .avatar { width: 100%; height: 100%; border-radius: 50%; background-color: #111; object-fit: cover; }
        
        .root-node h1 {
            font-family: var(--font-serif); font-size: 3rem; font-weight: 400; margin-bottom: 5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .root-node p {
            color: var(--text-muted); font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .item-node { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .item-node:hover { transform: translate(-50%, -50%) scale(1.1); z-index: 10 !important; }

        .node-content {
            display: flex; align-items: center; gap: 12px; text-decoration: none; color: white;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px 12px 12px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: all; cursor: pointer;
        }
        .item-node:hover .node-content {
            background: rgba(40, 40, 40, 0.8); border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.1);
        }

        .node-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        .node-icon i { width: 18px; height: 18px; color: var(--text-primary); }
        .node-info { display: flex; flex-direction: column; }
        .node-tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
        .node-title { font-size: 0.95rem; font-weight: 500; }

        .interaction-hint {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: var(--text-muted); font-size: 0.85rem; letter-spacing: 0.05em;
            opacity: 0.5; pointer-events: none; z-index: 100;
        }

        /* --- Knowledge Panel (Glassmorphism Slide-out) --- */
        #knowledge-panel {
            position: fixed;
            top: 0; right: -600px;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            padding: 60px 40px;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
            user-select: text; /* Allow reading/selecting text */
        }
        
        @media (max-width: 600px) {
            #knowledge-panel {
                max-width: 100vw;
                padding: 60px 20px;
                right: -100vw;
            }
        }

        #knowledge-panel.open {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 30px; right: 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        /* Markdown Styles */
        .markdown-body {
            color: var(--text-primary);
            line-height: 1.7;
        }
        .markdown-body h2 {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }
        .markdown-body h3 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-top: 40px;
            margin-bottom: 15px;
            color: #ccc;
        }
        .markdown-body p { margin-bottom: 20px; font-weight: 300; font-size: 1.05rem; }
        .markdown-body em { color: var(--text-muted); }
        .markdown-body ul { margin-bottom: 20px; padding-left: 20px; font-weight: 300; }
        .markdown-body li { margin-bottom: 8px; }
        .markdown-body blockquote {
            border-left: 3px solid rgba(90,40,255,0.6);
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: #aaa;
        }
        .markdown-body a {
            color: #58a6ff;
            text-decoration: none;
            border-bottom: 1px solid rgba(88, 166, 255, 0.3);
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: #58a6ff; }
        
        /* Loading State */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--text-muted); font-family: var(--font-sans); font-size: 0.9rem; letter-spacing: 0.1em;
            z-index: 50; display: flex; align-items: center; gap: 10px;
            transition: opacity 0.5s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-top-color: white;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="noise-overlay"></div>

    <div class="top-nav">
        <a href="https://linkedin.com/in/davislozda" target="_blank" class="nav-btn"><i data-lucide="linkedin"></i> LinkedIn</a>
        <a href="mailto:davislozda@gmail.com" class="nav-btn"><i data-lucide="mail"></i> Email</a>
        <a href="Davis_Lozda_CV.docx" download class="nav-btn primary"><i data-lucide="download"></i> Download CV</a>
    </div>

    <div id="loading"><div class="spinner"></div> INITIATING NEURAL GRAPH</div>

    <div id="graph-container" style="opacity: 0;">
        <svg id="links-svg"></svg>
        <div id="nodes-container"></div>
    </div>

    <div class="interaction-hint">Grab nodes to move. Click nodes to read.</div>

    <!-- The Knowledge Panel -->
    <div id="knowledge-panel">
        <button id="close-panel" class="close-btn"><i data-lucide="x"></i></button>
        <div id="panel-content" class="markdown-body"></div>
    </div>

    <script>
        lucide.createIcons();

        // Panel Logic
        const panel = document.getElementById('knowledge-panel');
        const closeBtn = document.getElementById('close-panel');
        const panelContent = document.getElementById('panel-content');
        const graphContainer = document.getElementById('graph-container');

        function openPanel(markdownData) {
            panelContent.innerHTML = marked.parse(markdownData);
            panel.classList.add('open');
            graphContainer.classList.add('graph-blurred');
            lucide.createIcons();
        }

        function closePanelFunc() {
            panel.classList.remove('open');
            graphContainer.classList.remove('graph-blurred');
        }

        closeBtn.addEventListener('click', closePanelFunc);

        // Fetch Knowledge Data
        fetch(`knowledge.json?v=${new Date().getTime()}`)
            .then(res => res.json())
            .then(data => {
                const loadingElement = document.getElementById('loading');
                loadingElement.classList.add('hidden');
                setTimeout(() => loadingElement.style.display = 'none', 500); // Wait for transition
                document.getElementById('graph-container').style.opacity = '1';
                initGraph(data);
            })
            .catch(err => {
                console.error("Failed to load knowledge", err);
                document.getElementById('loading').innerHTML = "ERROR: Failed to load knowledge base.";
            });

        // D3 Graph Logic
        function initGraph(data) {
            // Add root node to nodes array dynamically
            const nodesData = [
                { id: "root", type: "root", label: data.profile.name, desc: data.profile.subtitle, avatar: data.profile.avatar },
                ...data.nodes
            ];
            const linksData = data.links;

            const width = window.innerWidth;
            const height = window.innerHeight;

            const svg = d3.select("#links-svg")
                .attr("width", width)
                .attr("height", height);

            const nodesContainer = d3.select("#nodes-container");

            const simulation = d3.forceSimulation(nodesData)
                .force("link", d3.forceLink(linksData).id(d => d.id).distance(250))
                .force("charge", d3.forceManyBody().strength(-1000))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(90));

            const link = svg.append("g")
                .selectAll("line")
                .data(linksData)
                .join("line")
                .attr("class", "graph-link");

            const node = nodesContainer.selectAll(".graph-node")
                .data(nodesData)
                .join("div")
                .attr("class", d => d.type === "root" ? "graph-node root-node" : "graph-node item-node")
                .html(d => {
                    if (d.type === "root") {
                        return `
                            <div class="avatar-ring">
                                <img src="${d.avatar}" alt="${d.label}" class="avatar">
                            </div>
                            <h1>${d.label}</h1>
                            <p>${d.desc}</p>
                        `;
                    } else {
                        return `
                            <div class="node-content">
                                <div class="node-icon"><i data-lucide="${d.icon}"></i></div>
                                <div class="node-info">
                                    <span class="node-tag">${d.type}</span>
                                    <span class="node-title">${d.title}</span>
                                </div>
                            </div>
                        `;
                    }
                })
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // Handle Node Clicks
            node.on("click", (event, d) => {
                // Prevent opening panel if we were just dragging
                if (event.defaultPrevented || d.type === "root") return; 
                openPanel(d.markdown);
            });

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .style("left", d => `${d.x}px`)
                    .style("top", d => `${d.y}px`);
            });

            lucide.createIcons();

            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
                d3.select(this).raise();
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            window.addEventListener('resize', () => {
                const w = window.innerWidth;
                const h = window.innerHeight;
                svg.attr("width", w).attr("height", h);
                simulation.force("center", d3.forceCenter(w / 2, h / 2));
                simulation.alpha(0.3).restart();
            });
        }
    </script>
</body>
</html>
