<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davis Lozda | Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.292.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        :root {
            --bg-base: #050505;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #888;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Instrument Serif', serif;
        }
        body {
            margin: 0; background-color: var(--bg-base); color: var(--text-main);
            font-family: var(--font-sans); overflow-x: hidden;
        }
        .ambient-glow { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.15; top: -10%; right: -10%; background: radial-gradient(circle, #e24a73 0%, transparent 70%); }
        .top-nav { position: fixed; top: 30px; left: 30px; display: flex; z-index: 100; }
        .nav-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 30px; color: var(--text-main); text-decoration: none;
            font-size: 0.9rem; backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        
        .header { text-align: center; margin-top: 100px; color: #fff; padding: 0 20px; }
        .header h1 { font-family: var(--font-serif); font-size: 3.5rem; margin-bottom: 15px; font-weight: normal; }
        .header p { color: var(--text-muted); font-size: 1.1rem; font-style: italic; max-width: 600px; margin: 0 auto; line-height: 1.5; }
        
        .list-container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .list-item { 
            background: rgba(30, 30, 30, 0.3); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 30px; margin-bottom: 25px; cursor: pointer; transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .list-item:hover { transform: translateY(-5px); background: rgba(40, 40, 40, 0.5); border-color: rgba(255,255,255,0.2); }
        .list-content h3 { margin: 0 0 10px 0; font-size: 2rem; font-family: var(--font-serif); font-weight: normal; }
        .list-content .date { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 15px; }
        .list-content p { color: #ccc; font-size: 1.05rem; line-height: 1.6; margin: 0; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { display: block; opacity: 1; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-base); padding: 50px; border-radius: 20px; width: 90%; max-width: 700px; border: 1px solid var(--glass-border); color: #fff; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 25px; right: 25px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-modal:hover { color: #fff; }
        
        #modal-content { line-height: 1.7; font-size: 1.1rem; color: #ddd; }
        #modal-content p { margin-bottom: 1.5em; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="top-nav">
        <a href="../" class="nav-btn"><i data-lucide="arrow-left"></i> Back to Portfolio</a>
    </div>

    <div class="header">
        <h1>Blog</h1>
        <p>"Thanks for reading. This is just my opinion, I don't know anything, don't judge."</p>
    </div>

    <div class="list-container" id="blog-list"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <i data-lucide="x" class="close-modal" id="close-modal"></i>
            <div id="modal-content"></div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
        
        const overlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-modal');

        function openModal(post) {
            modalContent.innerHTML = `
                <h2 style="font-family: var(--font-serif); font-size: 2.8rem; margin-bottom: 10px; font-weight: normal;">${post.title}</h2>
                <div style="color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; margin-bottom: 40px;">${post.date}</div>
                <div>${marked.parse(post.content)}</div>
            `;
            overlay.classList.add('show');
        }

        function closeModal() {
            overlay.classList.remove('show');
        }

        closeBtn.onclick = closeModal;
        overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

        fetch('blog.json?v=2').then(r=>r.json()).then(data => {
            const container = document.getElementById('blog-list');
            data.forEach(post => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-content">
                        <h3>${post.title}</h3>
                        <div class="date">${post.date}</div>
                        <p>${post.summary}</p>
                    </div>
                `;
                item.onclick = () => openModal(post);
                container.appendChild(item);
            });
        });
    </script>
</body>
</html>
